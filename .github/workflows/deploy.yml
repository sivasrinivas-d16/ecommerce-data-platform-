name: Deploy E-Commerce Data Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload source code
        run: |
          aws s3 sync src/ s3://ecommerce-data-platform-version1/code/src/

      - name: Upload schemas
        run: |
          aws s3 sync schemas/ s3://ecommerce-data-platform-version1/code/schemas/

      - name: Upload documentation
        run: |
          aws s3 sync docs/ s3://ecommerce-data-platform-version1/code/docs/

      - name: Verify S3 deployment
        run: |
          aws s3 ls s3://ecommerce-data-platform-version1/code/ --recursive