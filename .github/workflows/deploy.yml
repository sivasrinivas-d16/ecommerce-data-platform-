name: Deploy E-Commerce Data Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-data-platform-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  S3_BUCKET: ecommerce-data-platform-version1
  RAW_LAYER_STATE_MACHINE: ecommerce-raw-layer-pipeline

jobs:
  deploy:
    name: Upload Data, Deploy and Run Pipeline
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =====================================================
      # 2. SET UP PYTHON
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install boto3

      # =====================================================
      # 3. CONFIGURE AWS CREDENTIALS
      # =====================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # 4. VERIFY AWS IDENTITY
      # =====================================================
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # =====================================================
      # 5. VALIDATE LOCAL DATASET DIRECTORY
      # =====================================================
      - name: Validate source datasets
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "data_s3" ]]; then
            echo "ERROR: data_s3 directory is missing."
            exit 1
          fi

          required_data=(
            "data_s3/customers.csv"
            "data_s3/products.csv"
            "data_s3/orders.csv"
            "data_s3/payments.csv"
            "data_s3/events.csv"
          )

          for file in "${required_data[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required dataset missing: $file"
              exit 1
            fi
          done

          echo "All five source datasets are available."

      # =====================================================
      # 6. UPLOAD SOURCE DATASETS TO S3
      # =====================================================
      - name: Upload source datasets to S3
        shell: bash
        run: |
          set -euo pipefail

          echo "Uploading CSV datasets to S3..."

          aws s3 sync data_s3/ \
            "s3://${S3_BUCKET}/data_s3/" \
            --exclude "*" \
            --include "*.csv"

          echo "Verifying uploaded objects..."

          for file in customers.csv products.csv orders.csv payments.csv events.csv; do
            aws s3api head-object \
              --bucket "${S3_BUCKET}" \
              --key "data_s3/${file}" \
              --query '{ContentLength:ContentLength,LastModified:LastModified}' \
              --output json

            echo "Verified: ${file}"
          done

          echo "All source datasets uploaded and verified."

      # =====================================================
      # 7. VALIDATE REQUIRED DEPLOYMENT FILES
      # =====================================================
      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "glue_jobs/raw_layer_main.py"
            "src/ingestion/ingest_customers.py"
            "src/ingestion/ingest_products.py"
            "src/ingestion/ingest_orders.py"
            "src/ingestion/ingest_payments.py"
            "src/ingestion/ingest_events.py"
            "src/utils/register_glue_tables.py"
            "src/utils/provision_glue_jobs.py"
            "src/utils/provision_step_function.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done

          echo "All required deployment files exist."

      # =====================================================
      # 8. PACKAGE RAW-LAYER MODULES
      # =====================================================
      - name: Package raw-layer modules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("src/ingestion")
          destination = Path("build/raw_modules.zip")

          modules = [
              "ingest_customers.py",
              "ingest_products.py",
              "ingest_orders.py",
              "ingest_payments.py",
              "ingest_events.py",
          ]

          for module in modules:
              path = source / module
              if not path.is_file():
                  raise FileNotFoundError(f"Missing module: {path}")

          with ZipFile(destination, "w", ZIP_DEFLATED) as archive:
              for module in modules:
                  archive.write(source / module, arcname=module)

          with ZipFile(destination) as archive:
              names = archive.namelist()
              print("ZIP contents:")
              for name in names:
                  print(f" - {name}")

              if set(names) != set(modules) or len(names) != len(modules):
                  raise RuntimeError("Unexpected raw-layer ZIP contents.")

          print(f"Created {destination}")
          PY

      # =====================================================
      # 9. UPLOAD RAW-LAYER GLUE SCRIPT AND MODULES
      # =====================================================
      - name: Upload raw-layer scripts
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            glue_jobs/raw_layer_main.py \
            "s3://${S3_BUCKET}/scripts/raw/raw_layer_main.py"

          aws s3 cp \
            build/raw_modules.zip \
            "s3://${S3_BUCKET}/scripts/raw/raw_modules.zip"

      # =====================================================
      # 10. UPLOAD SOURCE CODE
      # =====================================================
      - name: Upload source code
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync src/ \
            "s3://${S3_BUCKET}/code/src/"

      # =====================================================
      # 11. UPLOAD SCHEMAS
      # =====================================================
      - name: Upload schemas
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "schemas" ]]; then
            aws s3 sync schemas/ \
              "s3://${S3_BUCKET}/code/schemas/"
          else
            echo "Schemas directory not found; skipping."
          fi

      # =====================================================
      # 12. UPLOAD DOCUMENTATION
      # =====================================================
      - name: Upload documentation
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "docs" ]]; then
            aws s3 sync docs/ \
              "s3://${S3_BUCKET}/code/docs/"
          else
            echo "Docs directory not found; skipping."
          fi

      # =====================================================
      # 13. VERIFY RAW-LAYER S3 OBJECTS
      # =====================================================
      - name: Verify raw-layer S3 objects
        shell: bash
        run: |
          set -euo pipefail

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/raw/raw_layer_main.py

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/raw/raw_modules.zip

          echo "Raw-layer script and module ZIP verified."

      # =====================================================
      # 14. REGISTER GLUE CATALOG TABLES
      # =====================================================
      - name: Register Glue Catalog tables
        shell: bash
        run: |
          set -euo pipefail
          python src/utils/register_glue_tables.py

      # =====================================================
      # 15. PROVISION / UPDATE GLUE JOBS
      # =====================================================
      - name: Provision Glue jobs
        shell: bash
        run: |
          set -euo pipefail
          python src/utils/provision_glue_jobs.py

      # =====================================================
      # 16. VERIFY RAW-LAYER GLUE JOB
      # =====================================================
      - name: Verify raw-layer Glue job
        shell: bash
        run: |
          set -euo pipefail

          aws glue get-job \
            --job-name ecommerce_raw_layer \
            --region "${AWS_REGION}" \
            --query 'Job.{Name:Name,Role:Role,Script:Command.ScriptLocation,Version:GlueVersion,Arguments:DefaultArguments}' \
            --output json

      # =====================================================
      # 17. DEPLOY / UPDATE STEP FUNCTIONS
      # =====================================================
      - name: Deploy Step Functions
        shell: bash
        run: |
          set -euo pipefail
          python src/utils/provision_step_function.py

      # =====================================================
      # 18. VERIFY STATE MACHINE
      # =====================================================
      - name: Verify raw-layer state machine
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          STATE_MACHINE_ARN="arn:aws:states:${AWS_REGION}:${ACCOUNT_ID}:stateMachine:${RAW_LAYER_STATE_MACHINE}"

          aws stepfunctions describe-state-machine \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --region "${AWS_REGION}" \
            --query '{name:name,status:status,arn:stateMachineArn}' \
            --output json

          echo "STATE_MACHINE_ARN=${STATE_MACHINE_ARN}" >> "$GITHUB_ENV"

      # =====================================================
      # 19. START RAW-LAYER EXECUTION
      # =====================================================
      - name: Start raw-layer pipeline
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_NAME="raw-layer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          aws stepfunctions start-execution \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --name "${EXECUTION_NAME}" \
            --input '{}' \
            --region "${AWS_REGION}"

          echo "Started execution: ${EXECUTION_NAME}"
