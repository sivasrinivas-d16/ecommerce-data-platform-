
name: Deploy E-Commerce Data Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-data-platform-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  S3_BUCKET: ecommerce-data-platform-version1
  RAW_LAYER_STATE_MACHINE: ecommerce-raw-layer-pipeline
  SOURCE_GENERATION_GLUE_JOB: ecommerce_generate_source_data
  RAW_LAYER_GLUE_JOB: ecommerce_raw_layer

jobs:
  deploy:
    name: Deploy and Run E-Commerce Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # =====================================================
      # 2. SET UP PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install boto3

      # =====================================================
      # 3. CONFIGURE AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # 4. VERIFY AWS IDENTITY
      # =====================================================

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # =====================================================
      # 5. VALIDATE DEPLOYMENT FILES
      # =====================================================

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "glue_jobs/generate_source_data.py"
            "glue_jobs/raw_layer_main.py"
            "src/ingestion/ingest_customers.py"
            "src/ingestion/ingest_products.py"
            "src/ingestion/ingest_orders.py"
            "src/ingestion/ingest_payments.py"
            "src/ingestion/ingest_events.py"
            "src/utils/provision_glue_jobs.py"
            "src/utils/provision_step_function.py"
            "src/utils/register_glue_tables.py"
            "glue_jobs/quality_main.py"
            "src/quality/quality_customers.py"
            "src/quality/quality_products.py"
            "src/quality/quality_orders.py"
            "src/quality/quality_payments.py"
            "src/quality/quality_events.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done

          echo "All required deployment files exist."

      # =====================================================
      # 6. CHECK PYTHON SYNTAX
      # =====================================================

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            glue_jobs/generate_source_data.py \
            glue_jobs/raw_layer_main.py \
            src/ingestion/ingest_customers.py \
            src/ingestion/ingest_products.py \
            src/ingestion/ingest_orders.py \
            src/ingestion/ingest_payments.py \
            src/ingestion/ingest_events.py \
            src/utils/provision_glue_jobs.py \
            src/utils/provision_step_function.py \
            src/utils/register_glue_tables.py\
            glue_jobs/quality_main.py \
            src/quality/quality_customers.py \
            src/quality/quality_products.py \
            src/quality/quality_orders.py \
            src/quality/quality_payments.py \
            src/quality/quality_events.py \

          echo "Python syntax checks passed."

      
      # =====================================================
      # 7. PACKAGE RAW-LAYER AND VALIDATION MODULES
      # =====================================================

      - name: Package raw-layer and validation modules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          def create_zip(source_dir, destination, modules):
              source = Path(source_dir)
              destination = Path(destination)

              for module in modules:
                  path = source / module
                  if not path.is_file():
                      raise FileNotFoundError(
                          f"Missing module: {path}"
                      )

              with ZipFile(destination, "w", ZIP_DEFLATED) as archive:
                  for module in modules:
                      archive.write(
                          source / module,
                          arcname=module
                      )

              with ZipFile(destination, "r") as archive:
                  names = archive.namelist()
                  print(f"{destination} contents:", names)

                  if set(names) != set(modules) or len(names) != len(modules):
                      raise RuntimeError(
                          f"Unexpected ZIP contents: {destination}"
                      )

              print(f"Created {destination}")

          # Raw-layer modules
          create_zip(
              "src/ingestion",
              "build/raw_modules.zip",
              [
                  "ingest_customers.py",
                  "ingest_products.py",
                  "ingest_orders.py",
                  "ingest_payments.py",
                  "ingest_events.py",
              ],
          )

          # Validation modules
          create_zip(
              "src/validation",
              "build/validation_modules.zip",
              [
                  "validation_customers.py",
                  "validation_products.py",
                  "validation_orders.py",
                  "validation_payments.py",
                  "validation_events.py",
              ],
          )
          # Quality modules
          create_zip(
              "src/quality",
              "build/quality_modules.zip",
              [
                  "quality_customers.py",
                  "quality_products.py",
                  "quality_orders.py",
                  "quality_payments.py",
                  "quality_events.py",
              ],
          )
          PY
       
      # =====================================================
      # 8. UPLOAD GLUE SCRIPTS
      # =====================================================

      - name: Upload Glue scripts
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            glue_jobs/generate_source_data.py \
            "s3://${S3_BUCKET}/scripts/generate_source_data.py" \
            --region "${AWS_REGION}"

          aws s3 cp \
            glue_jobs/raw_layer_main.py \
            "s3://${S3_BUCKET}/scripts/raw/raw_layer_main.py" \
            --region "${AWS_REGION}"

          aws s3 cp \
            build/raw_modules.zip \
            "s3://${S3_BUCKET}/scripts/raw/raw_modules.zip" \
            --region "${AWS_REGION}"

          aws s3 cp \
            build/validation_modules.zip \
            "s3://${S3_BUCKET}/scripts/validation_modules.zip" \
            --region "${AWS_REGION}"

          aws s3 cp \
            glue_jobs/validation_layer_main.py \
            "s3://${S3_BUCKET}/scripts/validation_main.py" \
            --region "${AWS_REGION}"
          aws s3 cp \
          glue_jobs/quality_main.py \
          "s3://${S3_BUCKET}/scripts/quality_main.py" \
          --region "${AWS_REGION}"

          aws s3 cp \
            build/quality_modules.zip \
            "s3://${S3_BUCKET}/scripts/quality_modules.zip" \
            --region "${AWS_REGION}"

          echo "Glue scripts and module ZIPs uploaded successfully."

      # =====================================================
      # 9. UPLOAD SOURCE CODE
      # =====================================================

      - name: Upload source code
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync src/ \
            "s3://${S3_BUCKET}/code/src/" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc"

      # =====================================================
      # 10. UPLOAD SCHEMAS AND DOCUMENTATION
      # =====================================================

      - name: Upload schemas and documentation
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "schemas" ]]; then
            aws s3 sync schemas/ \
              "s3://${S3_BUCKET}/code/schemas/"
          fi

          if [[ -d "docs" ]]; then
            aws s3 sync docs/ \
              "s3://${S3_BUCKET}/code/docs/"
          fi
      # =====================================================
      # 11. CREATE OR UPDATE GLUE CATALOG TABLES
      # =====================================================
      - name: Create or update Glue Catalog tables
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading JSON schemas from S3..."
          mkdir -p code/schemas
          aws s3 sync \
            "s3://${S3_BUCKET}/code/schemas/" \
            code/schemas/ \
            --exclude "*" \
            --include "*.json"

          echo "Checking downloaded schema files..."
          find code/schemas -maxdepth 1 -type f -name "*.json" -print
          if ! find code/schemas -maxdepth 1 -type f -name "*.json" -print -quit | grep -q .; then
            echo "ERROR: No JSON schemas found in s3://${S3_BUCKET}/code/schemas/"
            exit 1
          fi

          python src/utils/register_glue_tables.py

          for table in customers products orders payments events customers_curated; do
            echo "Verifying Glue Catalog table: ${table}"
            aws glue get-table \
              --database-name ecommerce_data_platform \
              --name "${table}" \
              --region "${AWS_REGION}" \
              --query 'Table.{Name:Name,Location:StorageDescriptor.Location,Format:StorageDescriptor.SerdeInfo.SerializationLibrary}' \
              --output json
          done

          echo "Glue Catalog tables created/updated and verified."
          
      
      # =====================================================
      # 11. VERIFY SCRIPT OBJECTS
      # =====================================================

      - name: Verify uploaded scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying validation main script..."

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/validation_main.py \
            --region "${AWS_REGION}"

          echo "Verifying validation modules ZIP..."

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/validation_modules.zip \
            --region "${AWS_REGION}"

          echo "Verifying source-generation script..."

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/generate_source_data.py \
            --region "${AWS_REGION}"

          echo "Verifying raw-layer script..."

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/raw/raw_layer_main.py \
            --region "${AWS_REGION}"

          echo "Verifying raw-layer modules ZIP..."

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/raw/raw_modules.zip \
            --region "${AWS_REGION}"
          echo "Verifying quality main script..."

          echo "Verifying quality main script..."

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/quality_main.py \
            --region "${AWS_REGION}"

          echo "Verifying quality modules ZIP..."

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key scripts/quality_modules.zip \
            --region "${AWS_REGION}"
          echo "All required S3 objects verified successfully."

      # =====================================================
      # 12. PROVISION BOTH GLUE JOBS
      # =====================================================

      - name: Provision Glue jobs
        shell: bash
        run: |
          set -euo pipefail

          python src/utils/provision_glue_jobs.py

      - name: Deploy Lambda and IAM resources
        shell: bash
        run: |
          set -euo pipefail
          python deploy_validation_gate.py --source validation_gate.py

      

      # =====================================================
      # 13. VERIFY SOURCE GENERATION JOB
      # =====================================================

      - name: Verify source generation Glue job
        shell: bash
        run: |
          set -euo pipefail

          aws glue get-job \
            --job-name "${SOURCE_GENERATION_GLUE_JOB}" \
            --region "${AWS_REGION}" \
            --query 'Job.{Name:Name,Role:Role,Script:Command.ScriptLocation,Version:GlueVersion}' \
            --output json
      - name: Verify deployed Lambda
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function \
            --function-name "${LAMBDA_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Configuration.{FunctionName:FunctionName,Runtime:Runtime,Handler:Handler,Role:Role,State:State,Timeout:Timeout}' \
            --output json
          echo "Validation-gate Lambda deployment verified."
      # =====================================================
      # 14. VERIFY RAW-LAYER GLUE JOB
      # =====================================================

      - name: Verify raw-layer Glue job
        shell: bash
        run: |
          set -euo pipefail

          aws glue get-job \
            --job-name "${RAW_LAYER_GLUE_JOB}" \
            --region "${AWS_REGION}" \
            --query 'Job.{Name:Name,Role:Role,Script:Command.ScriptLocation,Version:GlueVersion}' \
            --output json

      # =====================================================
      # 15. DEPLOY STEP FUNCTIONS
      # =====================================================

      - name: Deploy Step Functions
        shell: bash
        run: |
          set -euo pipefail

          python src/utils/provision_step_function.py

      # =====================================================
      # 16. VERIFY STATE MACHINE
      # =====================================================

      - name: Verify state machine
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          STATE_MACHINE_ARN="arn:aws:states:${AWS_REGION}:${ACCOUNT_ID}:stateMachine:${RAW_LAYER_STATE_MACHINE}"

          aws stepfunctions describe-state-machine \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --region "${AWS_REGION}" \
            --query '{name:name,status:status,arn:stateMachineArn,definition:definition}' \
            --output json

          echo "STATE_MACHINE_ARN=${STATE_MACHINE_ARN}" >> "$GITHUB_ENV"

      # # =====================================================
      # # 17. START THE PIPELINE
      # # =====================================================

      # - name: Start raw-layer pipeline
      #   shell: bash
      #   run: |
      #     set -euo pipefail

      #     EXECUTION_NAME="raw-layer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      #     EXECUTION_ARN=$(aws stepfunctions start-execution \
      #       --state-machine-arn "${STATE_MACHINE_ARN}" \
      #       --name "${EXECUTION_NAME}" \
      #       --input '{}' \
      #       --region "${AWS_REGION}" \
      #       --query executionArn \
      #       --output text)

      #     echo "EXECUTION_ARN=${EXECUTION_ARN}" >> "$GITHUB_ENV"
      #     echo "Started execution: ${EXECUTION_ARN}"

      # # =====================================================
      # # 18. VERIFY PIPELINE STARTED — DO NOT WAIT
      # # =====================================================

      # - name: Verify raw-layer pipeline started
      #   shell: bash
      #   run: |
      #     set -euo pipefail

      #     if [[ -z "${EXECUTION_ARN:-}" || "${EXECUTION_ARN}" == "None" ]]; then
      #       echo "ERROR: Step Functions execution ARN was not returned."
      #       exit 1
      #     fi

      #     aws stepfunctions describe-execution \
      #       --execution-arn "${EXECUTION_ARN}" \
      #       --region "${AWS_REGION}" \
      #       --query '{executionArn:executionArn,status:status,startDate:startDate}' \
      #       --output json

      #     echo "Step Functions execution was started successfully."
      #     echo "Execution ARN: ${EXECUTION_ARN}"
      #     echo "The workflow will not wait for pipeline completion."

      # =====================================================
      # 19. CATALOG REGISTRATION
      # =====================================================
      # Run register_glue_tables.py separately after the
      # raw-layer pipeline completes successfully.
      # Do not register tables immediately after starting it.